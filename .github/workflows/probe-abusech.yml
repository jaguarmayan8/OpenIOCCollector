name: Probe abuse.ch reachability

# One-shot diagnostic: answers "can a GitHub Actions runner reach the
# abuse.ch hosts at all, and if so, with what result?" Run it manually from
# the Actions tab, read the summary, then DELETE this file (it has no
# recurring schedule on purpose).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show runner egress IP
        run: |
          echo "Runner egress IP (as seen by the target):"
          curl -s --max-time 15 https://api.ipify.org || echo "(ipify unreachable)"
          echo

      - name: HEAD probe (all four abuse.ch hosts)
        run: |
          echo "| Host | HTTP status | Total time (s) | Remote IP |"
          echo "|---|---|---|---|"
          for host in sslbl.abuse.ch urlhaus-api.abuse.ch threatfox-api.abuse.ch mb-api.abuse.ch; do
            # -I = HEAD; some servers reject HEAD, so fall back to GET below
            result=$(curl -sS -o /dev/null -I --max-time 45 \
              -w '%{http_code} %{time_total} %{remote_ip}' \
              "https://$host/" 2>&1) || true
            echo "| $host | $result | | |"
          done

      - name: GET probe (sslbl data file - the one that timed out)
        run: |
          echo "GET https://sslbl.abuse.ch/blacklist/sslblacklist.csv"
          code=$(curl -sS -o /tmp/sslbl.csv --max-time 60 \
            -w '%{http_code}' \
            "https://sslbl.abuse.ch/blacklist/sslblacklist.csv" 2>&1) || true
          size=$(stat -c%s /tmp/sslbl.csv 2>/dev/null || echo 0)
          echo "HTTP status: $code, body size: $size bytes"
          head -c 200 /tmp/sslbl.csv 2>/dev/null; echo

      - name: ThreatFox API POST (proves reachability + auth in one call)
        # A form-encoded body yields query_status=no_json IF the API is
        # reachable (that is the API rejecting the body, not the network).
        # unknown_auth_key = reachable AND the secret is wrong/missing.
        # timeout / connection refused = network blocked.
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          echo "POST https://threatfox-api.abuse.ch/api/v1/ (Auth-Key header from secret)"
          resp=$(curl -sS --max-time 60 \
            -H "Auth-Key: $ABUSECH_AUTH_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"get_iocs","days":1}' \
            -w '\nHTTP_CODE:%{http_code} TIME:%{time_total}s' \
            "https://threatfox-api.abuse.ch/api/v1/" 2>&1) || true
          echo "$resp" | head -c 600
          echo
          # Pull out query_status for the summary line
          status=$(echo "$resp" | grep -o '"query_status"[^,}]*' | head -1 || true)
          echo "QUERY_STATUS: ${status:-<no JSON - likely network blocked>}"

      - name: URLhaus export GET (key-in-path, real data test)
        # Downloads the first bytes of the authenticated export. The key is
        # a GitHub secret and is masked automatically in logs.
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          code=$(curl -sS -o /tmp/urlhaus.csv --max-time 90 -r 0-1023 \
            -w '%{http_code} TIME:%{time_total}s' \
            "https://urlhaus-api.abuse.ch/v2/files/exports/${ABUSECH_AUTH_KEY}/recent.csv" 2>&1) || true
          size=$(stat -c%s /tmp/urlhaus.csv 2>/dev/null || echo 0)
          echo "HTTP status/time: $code, downloaded bytes: $size"
          head -c 200 /tmp/urlhaus.csv 2>/dev/null; echo

      - name: MalwareBazaar API POST (form-encoded, as the collector does)
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          resp=$(curl -sS --max-time 60 \
            -H "Auth-Key: $ABUSECH_AUTH_KEY" \
            -d "query=get_recent&selector=1" \
            -w '\nHTTP_CODE:%{http_code} TIME:%{time_total}s' \
            "https://mb-api.abuse.ch/api/v1/" 2>&1) || true
          echo "$resp" | head -c 600
          echo
          status=$(echo "$resp" | grep -o '"query_status"[^,}]*' | head -1 || true)
          echo "QUERY_STATUS: ${status:-<no JSON - likely network blocked>}"
