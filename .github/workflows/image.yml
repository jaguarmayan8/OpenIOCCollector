name: Container image

# Publishes the collector image to GHCR so the first command a stranger runs is
# `docker run ghcr.io/jaguarmayan8/ioc-collector` instead of clone + venv. The
# image is deliberately the collector only: lists, dashboard and checksums need
# git history for the staleness guard, so they stay on a host or in CI.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "collector.py"
      - "requirements.txt"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write        # push to ghcr.io/<owner>/<repo>

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      # Pinned to commit SHAs for the same reason collector.yml is: a tag can
      # be re-pointed at any commit by whoever controls the action's repo.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ioc-collector
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
