name: Daily IOC collection

on:
  schedule:
    # Daily at 04:30 UTC. GitHub schedule cron is UTC and can drift by
    # 15+ minutes - do not chain anything tightly to this exact minute.
    - cron: "30 4 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

permissions:
  contents: write         # needed to commit Output/ and the CDB lists back
  issues: write           # needed by the failure reporter below

concurrency:
  group: ioc-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Pinned to a full commit SHA, not the mutable `@v4` / `@v5` tags: a tag
      # can be re-pointed at any commit by whoever controls the action's repo,
      # and the next run would execute code nobody reviewed. Update the SHA
      # deliberately, with the version in the trailing comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # Runs the stdlib unittest suite. No pip: the tests import only
      # ioc_extract.py / generate_dashboard.py, never requests. This fails the
      # job BEFORE a broken build can commit lists or push a dashboard.
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      # Secrets come from repo settings - no key files on any runner.
      # collector.py exits 1 if fewer than 2 feeds returned data, which
      # fails the workflow BEFORE anything broken is committed.
      - name: Run collector
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 collector.py

      - name: Build CDB lists, guard, VT enrichment, dashboard, prune
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        # tee so the failure reporter can quote the real reason. pipefail is
        # MANDATORY: without it the pipeline's status is tee's (always 0), so a
        # guard abort looks like success and the job publishes a shrunken list.
        run: |
          set -o pipefail
          bash build_lists.sh 2>&1 | tee build.log

      # Raw dumps go to a Release asset, NOT to git. Committing them added
      # ~38 MB/day to history permanently (that is what pushed this repo past
      # 1 GB) and prune_output.py could never reclaim it. See SIZE_FIX.md.
      # Today's folder is never pruned, so the files are still on disk here.
      - name: Publish raw dumps as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_KEEP_DAYS: "30"
        run: bash publish_raw.sh

      - name: Commit and push
        run: |
          git config user.name "ioc-collector[bot]"
          git config user.email "ioc-collector[bot]@users.noreply.github.com"
          git add Output/ docs/index.html checksums.sha256 malicious-ips.txt malicious-domains.txt malicious-hashes.txt
          # The sidecar only exists after the first healthy ThreatFox day; a
          # bare `git add` of a missing path exits non-zero and fails the step.
          [ -f threatfox-domains.txt ] && git add threatfox-domains.txt || true
          git commit -m "Daily IOC update $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

      # Durable failure record. A red run only notifies whoever last touched
      # the cron line, and disappears from view within a day; an issue stays on
      # the repo page until it is closed. Repeats comment on the same issue
      # instead of opening a new one every night.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          TITLE="[auto] nightly IOC collection failed"
          TAIL=$(tail -25 build.log 2>/dev/null || echo "(no build.log - failed before the build step)")
          printf -v BODY 'The scheduled IOC collection run failed.\n\nRun: %s\nCommit: %s\nReported: %s\n\nNothing was published: the CDB lists and dashboard still hold the previous successful run, and Wazuh is serving those.\n\n```\n%s\n```\n' "$RUN_URL" "${GITHUB_SHA:-unknown}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TAIL"
          EXISTING=$(gh issue list --state open --limit 100 --search "in:title nightly IOC collection failed" --json number --jq '.[0].number // empty' 2>/dev/null) || EXISTING=""
          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "could not comment on issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "could not open an issue - see $RUN_URL"
          fi
